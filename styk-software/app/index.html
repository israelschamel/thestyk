<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Styk</title>
<meta name="description" content="Find your Styk tags: play a sound, check the battery and see where your phone last saw them.">
<meta name="theme-color" content="#F3F5F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16191C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Styk">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="bar">
    <div class="bar-inner">
      <div id="bar-left"></div>
      <div id="bar-right"></div>
    </div>
  </header>
  <main id="view" class="wrap"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog" class="dialog"></dialog>
  <noscript><p class="wrap note">The Styk app needs JavaScript turned on.</p></noscript>
</body>
</html>
