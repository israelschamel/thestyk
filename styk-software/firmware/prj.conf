# ---- Bluetooth Low Energy peripheral ----
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Styk"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=16
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1

# ---- Security: PIN (passkey) pairing, one owner, private rotating address ----
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_FIXED_PASSKEY=y
CONFIG_BT_SMP_APP_PAIRING_ACCEPT=y
CONFIG_BT_PRIVACY=y
CONFIG_BT_RPA_TIMEOUT=900

# ---- Standard services the app reads ----
CONFIG_BT_BAS=y
CONFIG_BT_DIS=y
CONFIG_BT_DIS_MANUF="Styk"
CONFIG_BT_DIS_MODEL="Styk prototype"
CONFIG_BT_DIS_FW_REV=y
CONFIG_BT_DIS_FW_REV_STR="0.2.0"

# ---- Keep the owner's pairing across restarts ----
CONFIG_SETTINGS=y
CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

# ---- Hardware ----
CONFIG_PWM=y
CONFIG_GPIO=y
CONFIG_HWINFO=y
CONFIG_ADC=y
CONFIG_CRC=y

# ---- Serial console on the development kit, so you can read the tag code and PIN ----
# For battery-powered builds add:  -DEXTRA_CONF_FILE=overlay-lowpower.conf
CONFIG_PRINTK=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
